<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Whetstone"
     xmlns="http://www.w3.org/2000/svg">
  <!-- The stone: blue, broad, immovable. It cuts nothing. -->
  <rect x="4" y="46" width="56" height="12" rx="2.5" fill="#2e5f8a"/>
  <rect x="4" y="46" width="56" height="3.4" rx="1.7" fill="#3f79ab"/>

  <!-- The blade: red, drawn across the stone at the honing angle. -->
  <path d="M46 4.5 L54.2 10 L24.6 41.4 L20.4 37.2 Z" fill="#b03a2e"/>
  <path d="M46 4.5 L54.2 10 L50.6 13.8 L42.6 8.2 Z" fill="#8d2c22"/>
  <path d="M22.4 39.2 L48.4 12.0" stroke="#f7f4ee" stroke-width="1.5"
        stroke-linecap="round" opacity="0.5" fill="none"/>

  <!-- The spark: where the two sides meet, and the only place either is useful. -->
  <g stroke="#d99b2b" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M18.6 35.4 L13.2 30.6"/>
    <path d="M16.4 41.0 L9.8 40.0"/>
    <path d="M21.2 44.2 L18.4 49.6"/>
  </g>
</svg>
